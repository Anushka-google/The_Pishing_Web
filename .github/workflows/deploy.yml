name: CI/CD Public Cloud Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Stage 1: Quality Assurance & Test Verification
  test:
    name: Run Verification & Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Pytest Suite
        run: |
          python -m pytest tests/ -v

  # Stage 2: Docker Multi-Container Build & Sanity Check
  build-and-verify-containers:
    name: Build & Verify Production Docker Containers
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Containers
        run: |
          docker compose -f docker-compose.prod.yml build

      - name: Test Local Stack Boot
        run: |
          docker compose -f docker-compose.prod.yml up -d
          sleep 25
          docker compose -f docker-compose.prod.yml ps

      - name: Smoke Test Backend Health
        run: |
          curl --fail --retry 10 --retry-delay 3 http://localhost:80/health || exit 1

      - name: Smoke Test Prediction Pipeline
        run: |
          curl -s --retry 5 --retry-delay 3 -X POST http://localhost:80/predict \
            -H "Content-Type: application/json" \
            -d '{"url": "https://www.google.com"}' | grep -q "legitimate" || exit 1

      - name: Clean Up Test Stack
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml down -v

  # Stage 3: AWS Cloud Deployment (Triggered on pushes to main with AWS credentials)
  deploy-to-aws:
    name: Deploy to Public AWS Infrastructure
    needs: build-and-verify-containers
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        env:
          AWS_SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_PUBLIC_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
        run: |
          if [ -z "$AWS_SSH_KEY" ] || [ -z "$EC2_HOST" ]; then
            echo "AWS EC2 SSH credentials not configured in GitHub Secrets."
            echo "Skipping automated remote EC2 deployment."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$AWS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST << 'EOF'
            set -e
            cd /opt/phishintel || (git clone https://github.com/Anushka-google/The_Pishing_Web.git /opt/phishintel && cd /opt/phishintel)
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            docker system prune -f
          EOF
